[build-system]
requires = ["setuptools>=77"]  # PEP 639: `license` as an SPDX string
build-backend = "setuptools.build_meta"

[project]
name = "keystork"
version = "0.1.0"
description = "Drive a remote Android device's keystore2 over IP"
requires-python = ">=3.9"
license = "MIT"
license-files = []
dependencies = [
    # Generated with protoc 3.19.6; the generated module asserts on a runtime
    # older than its generator.
    "protobuf>=3.19",
    # Reads the key attestation extension. Pure Python, so installing this
    # client next to adb still needs no compiler.
    "asn1crypto>=1.5",
]

[project.scripts]
keystork = "keystork.cli:main"

[tool.setuptools.packages.find]
include = ["keystork*"]
