// keystork wire protocol.
//
// Framing: every message below is written as a 4-byte big-endian length
// followed by that many bytes of serialized protobuf. Every connection opens by
// saying what it is for:
//
//   client -> Open            (mandatory first message)
//   server -> OpenAck
//
// Some commands are complete at that point (kill_server). One that opens a
// session continues:
//
//   client -> Request         \  repeated, strictly synchronous,
//   server -> Response        /  one in flight at a time
//
// A Request before a successful Open is a protocol error, as is one that does
// not belong to the kind of session that was opened.
//
// Modeling rules (see design_docs/keystore-over-ip-design.md §4):
//   - The wire speaks KeyMint's raw integers. Enums from keystore2/KeyMint are
//     carried as int32 and named by the Python client, so new enum values need
//     no schema or server change.
//   - All key material and certificates are raw DER bytes. No PEM, no base64.

syntax = "proto3";

package keystork.v1;

option optimize_for = LITE_RUNTIME;

// Bumped only for incompatible changes to framing or the handshake.
// Open.protocol_version must equal this.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_1 = 1;
}

// ---------------------------------------------------------------------------
// Errors
// ---------------------------------------------------------------------------

message Error {
  enum Kind {
    KIND_UNSPECIFIED = 0;

    // keystore2 returned a service-specific Binder exception. `code` is
    // positive for a keystore2 ResponseCode and negative for an embedded
    // KeyMint ErrorCode; the sign disambiguates the two error spaces.
    SERVICE_SPECIFIC = 1;

    // The Binder transaction itself failed (dead node, UNKNOWN_TRANSACTION,
    // security exception, ...). `code` is a binder_status_t and
    // `exception_code` is a binder_exception_t.
    TRANSACTION = 2;

    // The client violated the protocol: bad framing, oversized message,
    // unparseable body, request before handshake, unsupported protocol
    // version, or an RPC this server build does not implement.
    PROTOCOL = 3;

    // Session setup failed before any keystore2 call: bad UID, setresgid /
    // setresuid failure, or the keystore2 service could not be reached.
    // Only ever carried in an OpenAck. `code` is an errno where one applies,
    // otherwise 0.
    IDENTITY = 4;
  }

  Kind kind = 1;

  // SERVICE_SPECIFIC: keystore2 ResponseCode (> 0) or KeyMint ErrorCode (< 0).
  // TRANSACTION:      binder_status_t.
  // PROTOCOL:         0.
  // IDENTITY:         errno, or 0 if none applies.
  int32 code = 2;

  // Human-readable detail. Diagnostic only; never parsed by the client.
  string message = 3;

  // TRANSACTION only: the binder_exception_t, kept separate from `code`
  // because the two spaces overlap numerically (EX_SECURITY == -1 and
  // STATUS_PERMISSION_DENIED == -1 are unrelated).
  int32 exception_code = 4;
}

// ---------------------------------------------------------------------------
// Open -- what this connection is for
//
// The daemon does more than one thing, and a keystore session is only one of
// them, so the first message names a command rather than declaring a UID. The
// version lives on the envelope rather than inside each command: it has to be
// readable before the command can be interpreted at all.
// ---------------------------------------------------------------------------

message Open {
  // Must be PROTOCOL_VERSION_1.
  uint32 protocol_version = 1;

  oneof command {
    StartKeystoreSession keystore = 2;
    KillServer kill_server = 3;
  }
}

// Opens a UID-scoped keystore2 session. The child permanently drops to the UID
// before opening Binder and can never return to root, which is why the UID is a
// per-connection property rather than a per-request one.
message StartKeystoreSession {
  // Who to be. A package name is resolved on the device, because the mapping
  // lives there and a client has no way to know it -- unlike enum names or
  // pagination, this is a device fact rather than an interpretation, so it is
  // not a case of the server knowing too much.
  oneof identity {
    // The UID directly; also becomes the primary GID.
    uint32 uid = 1;
    PackageIdentity package = 2;
  }
}

message PackageIdentity {
  // Exact package name, e.g. "com.google.android.gms".
  string name = 1;

  // Android user id. 0 is the primary user; a work profile is usually 10. The
  // UID is the package's app id offset by 100000 per user, which is the
  // platform's own arithmetic.
  uint32 user = 2;
}

// Stops the daemon. The supervisor SIGTERMs every live session and exits, so
// other clients lose their connections. Acked before anything is signalled, so
// the caller learns it was accepted. This grants nothing new: anything that can
// reach the socket can already act as any UID.
message KillServer {}

message OpenAck {
  // Unset on success. When set, the connection is over: the server closes it
  // immediately after writing this message.
  Error error = 1;

  uint32 protocol_version = 2;

  oneof result {
    KeystoreSessionStarted keystore = 3;
    KillServerAck kill_server = 4;
  }
}

message KeystoreSessionStarted {
  // What the device's keystore2 reports from getInterfaceVersion(). The client
  // owns the capability table keyed off this number, so it can say "this device
  // is V3, that call needs V5" rather than surfacing a bare
  // UNKNOWN_TRANSACTION.
  int32 keystore_interface_version = 1;

  // The UID this session actually became. Always set, so a client that asked by
  // package name learns what that resolved to.
  uint32 uid = 2;
}

message KillServerAck {}

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// android.system.keystore2.KeyDescriptor. Carries the full tuple and exposes
// every Domain value, not just the app-scoped common case.
message KeyDescriptor {
  // keystore2 Domain: APP=0, GRANT=1, SELINUX=2, BLOB=3, KEY_ID=4.
  int32 domain = 1;
  int64 nspace = 2;
  optional string alias = 3;
  optional bytes blob = 4;
}

// android.hardware.security.keymint.KeyParameter as a generic tagged value.
//
// A KeyMint Tag encodes its own TagType in its top four bits, so this one shape
// covers every parameter that exists and every one that ever will. The client
// names the tags; the server only picks which arm of KeyMint's
// KeyParameterValue union to fill, which it derives from those top four bits.
//
// Which arm to use is therefore *not* a naming decision, with one unavoidable
// exception: KeyParameterValue gives each enum its own arm (algorithm,
// blockMode, digest, ...), so a tag of type ENUM/ENUM_REP needs a tag-to-arm
// table on the server. That table is in server/src/session.cpp and is the only
// place the daemon knows what a tag means.
message KeyParameter {
  // A KeyMint Tag. Raw, and never validated.
  int32 tag = 1;

  // Which arm is set must match the tag's TagType:
  //   BOOL                     -> bool_value (KeyMint reads presence, not value)
  //   ENUM, ENUM_REP, UINT,
  //   UINT_REP                 -> integer
  //   ULONG, ULONG_REP, DATE   -> long_integer
  //   BYTES, BIGNUM            -> blob
  // A mismatch is not rejected here; keystore2 will refuse it.
  oneof value {
    bool bool_value = 2;
    uint32 integer = 3;
    uint64 long_integer = 4;
    bytes blob = 5;
  }
}

// ---------------------------------------------------------------------------
// list
// ---------------------------------------------------------------------------

message ListRequest {
  int32 domain = 1;
  int64 nspace = 2;

  // false -> IKeystoreService.listEntries (deprecated, available since V1)
  // true  -> IKeystoreService.listEntriesBatched (requires interface V3)
  //
  // The server does not choose. The client owns the capability table and the
  // pagination loop; each ListRequest is exactly one keystore2 call.
  bool batched = 3;

  // batched only: resume strictly after this alias. Unset starts at the
  // beginning.
  optional string starting_past_alias = 4;
}

message ListResponse {
  // One batch, in the order keystore2 returned it. For a batched call an
  // empty list means the end of the enumeration.
  repeated KeyDescriptor entries = 1;
}

// ---------------------------------------------------------------------------
// get_key_entry
// ---------------------------------------------------------------------------

// One entry of a key's authorization list: a KeyParameter plus which security
// level enforces it. A tag enforced by the TEE and the same tag enforced by
// keystore2 itself are different guarantees, so the level travels with it.
message Authorization {
  int32 security_level = 1;
  KeyParameter parameter = 2;
}

// android.system.keystore2.KeyMetadata. The IKeystoreSecurityLevel handle that
// comes back alongside it stays on the device.
message KeyMetadata {
  KeyDescriptor key = 1;

  // KeyMint SecurityLevel the key itself lives at.
  int32 key_security_level = 2;

  // How the key was generated: algorithm, permitted digests and paddings, key
  // size, auth requirements. This is what lets a client pick operation
  // parameters instead of being told them.
  repeated Authorization authorizations = 3;

  // Leaf certificate, DER. Absent for symmetric keys.
  optional bytes certificate = 4;

  // The rest of the chain, DER certificates concatenated. Splitting it is the
  // client's job.
  optional bytes certificate_chain = 5;

  int64 modification_time_ms = 6;
}

message GetKeyEntryRequest {
  KeyDescriptor key = 1;
}

message GetKeyEntryResponse {
  KeyMetadata metadata = 1;
}

// ---------------------------------------------------------------------------
// Operations (encrypt / decrypt / sign / verify)
//
// keystore2's createOperation hands back a live Binder handle to an operation
// object. The session's child holds that handle across round-trips, so the same
// machinery serves two shapes:
//
//   run_operation  -- create + updateAad + update + finish in one round-trip.
//   op_begin ...   -- the same steps as separate RPCs, for input too large to
//                     buffer into one message, or for incremental AAD.
//
// Requests in a session are synchronous, so at most one operation is ever in
// flight and the active one is implicit -- there are no operation IDs on the
// wire. If the client disconnects mid-operation the child dies, keystore2 sees
// the Binder death, and the operation is pruned.
//
// Auth-bound keys are out of scope: a HardwareAuthToken arrives through
// IKeystoreAuthorization, a service this daemon does not speak. The
// operation_challenge below is surfaced so a client can *see* that a key wanted
// one, not so it can satisfy it.
// ---------------------------------------------------------------------------

// The operation to create. Shared by run_operation and op_begin.
message OperationStart {
  KeyDescriptor key = 1;

  // KeyMint operation parameters: PURPOSE, plus whatever the key needs
  // (BLOCK_MODE, PADDING, DIGEST, MAC_LENGTH, NONCE, ...). Passed through as
  // sent.
  repeated KeyParameter parameters = 2;

  // keystore2 prunes a lower-priority operation to make room when true.
  bool forced = 3;

  // KeyMint SecurityLevel to ask IKeystoreService.getSecurityLevel for:
  // SOFTWARE=0, TRUSTED_ENVIRONMENT=1, STRONGBOX=2, KEYSTORE=100. The
  // sub-interface handle itself is never exposed on the wire.
  int32 security_level = 4;
}

// What createOperation returned, minus the Binder handle the server keeps.
message OperationBegun {
  // KeyMint's own parameters for the operation -- notably the NONCE it
  // generated when the caller did not supply one.
  repeated KeyParameter parameters = 1;

  // Set when the key is auth-bound: the challenge an auth token would have to
  // carry. Present means the operation will fail at finish without one.
  optional int64 operation_challenge = 2;

  // keystore2 re-wrapped the key blob (e.g. after an OS upgrade). A client
  // holding a Domain::BLOB descriptor should replace it with this.
  optional bytes upgraded_blob = 3;
}

message RunOperationRequest {
  OperationStart start = 1;

  // AEAD associated data, sent before any input. Kept separate from `input`
  // because updateAad and update are different calls.
  optional bytes aad = 2;

  // The whole crypto input. Absent is legal: finish() alone is a valid
  // operation for, say, an empty-message signature.
  optional bytes input = 3;

  // KeyPurpose::VERIFY only: the signature to check.
  optional bytes signature = 4;
}

message RunOperationResponse {
  OperationBegun begun = 1;

  // Everything update() and finish() produced, concatenated in order.
  optional bytes output = 2;
}

message OpBeginRequest {
  OperationStart start = 1;
}

message OpBeginResponse {
  OperationBegun begun = 1;
}

message OpUpdateAadRequest {
  bytes aad = 1;
}

message OpUpdateAadResponse {}

message OpUpdateRequest {
  bytes input = 1;
}

message OpUpdateResponse {
  // KeyMint may buffer instead of emitting on every update, so an absent
  // output is normal rather than an error.
  optional bytes output = 1;
}

message OpFinishRequest {
  optional bytes input = 1;
  optional bytes signature = 2;
}

message OpFinishResponse {
  optional bytes output = 1;
}

message OpAbortRequest {}

message OpAbortResponse {}

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------

message Request {
  oneof body {
    ListRequest list = 1;
    GetKeyEntryRequest get_key_entry = 8;
    RunOperationRequest run_operation = 2;
    OpBeginRequest op_begin = 3;
    OpUpdateAadRequest op_update_aad = 4;
    OpUpdateRequest op_update = 5;
    OpFinishRequest op_finish = 6;
    OpAbortRequest op_abort = 7;
  }
}

message Response {
  oneof body {
    Error error = 1;
    ListResponse list = 2;
    GetKeyEntryResponse get_key_entry = 9;
    RunOperationResponse run_operation = 3;
    OpBeginResponse op_begin = 4;
    OpUpdateAadResponse op_update_aad = 5;
    OpUpdateResponse op_update = 6;
    OpFinishResponse op_finish = 7;
    OpAbortResponse op_abort = 8;
  }
}
