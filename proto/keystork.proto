// keystork wire protocol.
//
// Framing: every message below is written as a 4-byte big-endian length
// followed by that many bytes of serialized protobuf.
//
// A connection has two levels. It starts at the top level, where the daemon is
// root and every exchange is one Command:
//
//   server -> Greeting                   (sent on accept, before anything else)
//   client -> Command      \  repeated, strictly synchronous,
//   server -> CommandResponse /  one in flight at a time
//
// Three commands hand the connection over to a subprotocol.
// open_keystore_session drops to the session's UID -- the connection becomes a
// keystore session, strictly synchronous like the top level:
//
//   client -> KeystoreRequest   \
//   server -> KeystoreResponse  /
//
// That one gives the connection back: end_session climbs to root through the
// saved UID the drop kept, and the top level resumes. The other two do not.
//
// exec starts a process -- the connection carries its stdio, and is the one
// place in this protocol where messages are *not* paired. Either side sends
// whenever it has something to say, until the process exits:
//
//   client -> Command{exec_input}    (stdin, resize, signal; any time, any number)
//   server -> CommandResponse{exec_event}  (output, exit; any time, any number)
//
// Those ride inside the top-level messages rather than in a pair of their own,
// and that is load-bearing rather than tidy. Being unpaired means a client's
// input can still be in flight when the child exits, so the daemon would have
// to decide, byte by byte, whether what arrives next belongs to the finished
// session or is the next command -- which is not decidable from the bytes.
// With one message type per direction there is nothing to decide: a late
// exec_input is recognizably itself and gets dropped.
//
// The other subprotocols do not need this, because they are strictly paired:
// the client sends nothing until it has the previous answer, so the boundary
// falls between messages by construction.
//
// open_integrity_session launches an app, takes its own code off every
// classpath in the process and puts ours there instead -- the connection
// becomes a conversation with that app, strictly synchronous:
//
//   client -> IntegrityRequest   \
//   server -> IntegrityResponse  /
//
// The daemon does not read either of those. It holds a socket to the app that
// nothing else on the device can reach and copies bytes between the two, so
// the messages below are a contract between the Python client and the Java in
// the app, and the daemon needs no change to serve a new one.
//
// exec and open_integrity_session have no way back: a connection carrying a
// process's stdio has nothing left to say a command in, and the app lives
// exactly as long as the connection that launched it. Reading files is a
// top-level command precisely because it always runs as root -- which, after a
// keystore session has ended, is true again.
//
// Modeling rules (see design_docs/keystore-over-ip-design.md §4):
//   - The wire speaks KeyMint's raw integers. Enums from keystore2/KeyMint are
//     carried as int32 and named by the Python client, so new enum values need
//     no schema or server change.
//   - All key material and certificates are raw DER bytes. No PEM, no base64.

syntax = "proto3";

package keystork.v1;

option optimize_for = LITE_RUNTIME;

// The app's half of the integrity subprotocol parses these too, so the Java is
// generated from this file as well. One class per message rather than one
// outer class holding all of them.
option java_multiple_files = true;

// Bumped only for incompatible changes to framing or the handshake.
// Greeting.protocol_version must equal this.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_1 = 1;
}

// ---------------------------------------------------------------------------
// Errors
// ---------------------------------------------------------------------------

message Error {
  enum Kind {
    KIND_UNSPECIFIED = 0;

    // keystore2 returned a service-specific Binder exception. `code` is
    // positive for a keystore2 ResponseCode and negative for an embedded
    // KeyMint ErrorCode; the sign disambiguates the two error spaces.
    SERVICE_SPECIFIC = 1;

    // The Binder transaction itself failed (dead node, UNKNOWN_TRANSACTION,
    // security exception, ...). `code` is a binder_status_t and
    // `exception_code` is a binder_exception_t.
    TRANSACTION = 2;

    // The client violated the protocol: bad framing, oversized message,
    // unparseable body, request before handshake, unsupported protocol
    // version, or an RPC this server build does not implement.
    PROTOCOL = 3;

    // A command failed for a reason outside keystore2: a privilege drop that
    // would not take, a file that could not be read, a binary that could not
    // be exec'd, an unreachable keystore2 service. `code` is an errno where
    // one applies, otherwise 0.
    IDENTITY = 4;

    // The Play Integrity API refused, from inside the app. `code` is its own
    // IntegrityErrorCode, kept as the number it is and named by the client,
    // exactly as KeyMint's are.
    INTEGRITY = 5;
  }

  Kind kind = 1;

  // SERVICE_SPECIFIC: keystore2 ResponseCode (> 0) or KeyMint ErrorCode (< 0).
  // TRANSACTION:      binder_status_t.
  // PROTOCOL:         0.
  // IDENTITY:         errno, or 0 if none applies.
  // INTEGRITY:        IntegrityErrorCode, or 0 if the failure had no code.
  int32 code = 2;

  // Human-readable detail. Diagnostic only; never parsed by the client.
  string message = 3;

  // TRANSACTION only: the binder_exception_t, kept separate from `code`
  // because the two spaces overlap numerically (EX_SECURITY == -1 and
  // STATUS_PERMISSION_DENIED == -1 are unrelated).
  int32 exception_code = 4;
}

// ---------------------------------------------------------------------------
// Top level
//
// The daemon does several things and a keystore session is only one of them, so
// the connection deals in commands rather than opening with a handshake. The
// server greets first: version validation happens once, before any command, and
// the client's command stream needs no special first message.
// ---------------------------------------------------------------------------

message Greeting {
  // Must equal the client's PROTOCOL_VERSION_1 or the client should hang up.
  uint32 protocol_version = 1;
}

message Command {
  oneof body {
    ReadFileRequest read_file = 1;
    KillServerRequest kill_server = 2;
    OpenKeystoreSessionRequest open_keystore_session = 3;
    ExecRequest exec = 4;
    OpenIntegritySessionRequest open_integrity_session = 5;

    // A running child's stdin, resize or signal. Here, rather than in a
    // message of its own, because exec is the one subprotocol that is not
    // paired -- see the note above Command.
    ExecInput exec_input = 6;
  }
}

message CommandResponse {
  oneof body {
    Error error = 1;
    ReadFileResponse read_file = 2;
    KillServerResponse kill_server = 3;
    KeystoreSessionOpened open_keystore_session = 4;
    ExecStarted exec = 5;
    IntegritySessionOpened open_integrity_session = 6;

    // A running child's output, or its exit. Unprompted, and any number of
    // them: the only response here that is not an answer to a command.
    ExecEvent exec_event = 7;
  }
}

// Launches `package`, takes its own code off every classpath in its process
// before a line of it has run, and hands the connection over to the app.
//
// Unlike everything else at this level this takes seconds rather than a round
// trip, because it has to catch a zygote fork: the daemon force-stops the
// package, seizes the zygote with PTRACE_O_TRACEFORK, launches the app, and
// steps the forked child until it drops to `uid`. Progress goes to logcat --
// `logcat -s keystorkd` -- since there is nowhere else for it to go before the
// response.
//
// It is a session because there is state worth holding open: the Standard
// integrity API's token provider takes seconds to prepare and is reusable, so
// it lives in the app for as long as this connection does.
message OpenIntegritySessionRequest {
  // Resolved to a component and launched. The daemon has no notion of
  // packages beyond handing this to `am`.
  string package = 1;

  // Which UID the forked child must drop to for the daemon to claim it as the
  // target. The daemon does not resolve this: the client reads the device's
  // package list at this same level, while it is still root, exactly as it
  // does for a keystore session.
  uint32 uid = 2;

  // Gives up if the app has not forked and specialized within this long.
  // Unset uses the daemon's own default, which is comfortably inside AMS's
  // ten-second process-start timeout.
  optional uint32 timeout_ms = 3;
}

// Sent once the app is up and answering. Everything here is diagnostic: the
// session is open whatever the numbers say, and anything that went wrong
// arrives as an Error instead.
message IntegritySessionOpened {
  // The app process that was caught, and the UID it had become.
  int32 pid = 1;
  uint32 uid = 2;

  // What the stepping cost, in syscalls: to the runtime landmark where the
  // agent can first touch a VM, and from there to the app's bind message.
  uint32 arm_steps = 3;
  uint32 bind_steps = 4;
}

// ---------------------------------------------------------------------------
// Integrity subprotocol
//
// A conversation with the Java running inside the app, relayed verbatim: the
// daemon copies these bytes between the client and a socket only it and the
// app can reach, and parses none of them.
//
// Both token flavours are here because they are different APIs, not different
// options: classic is one call and one token, standard needs a provider
// prepared once and then issues cheaply and repeatedly.
// ---------------------------------------------------------------------------

message IntegrityRequest {
  oneof body {
    ClassicTokenRequest classic = 1;
    PrepareStandardRequest prepare_standard = 2;
    StandardTokenRequest standard = 3;
  }
}

message IntegrityResponse {
  oneof body {
    Error error = 1;
    TokenIssued token = 2;
    StandardPrepared prepare_standard = 3;
  }
}

// One token, one call. `nonce` is passed to the API exactly as given: it must
// be URL-safe base64 without padding or wrapping, and 16..500 bytes once
// decoded. The client builds that string, because the client is where the
// caller's bytes are.
message ClassicTokenRequest {
  string nonce = 1;

  // Only needed for an app Play does not know. Unset means the app's own
  // linked project, which is the ordinary case.
  optional int64 cloud_project_number = 2;
}

// Prepares the Standard-mode token provider, which is the expensive half and
// is done once per session. The app keeps what this returns.
message PrepareStandardRequest {
  int64 cloud_project_number = 1;
}

message StandardPrepared {}

// Issues from the prepared provider. `request_hash` is bound into the token
// and is the caller's to choose -- typically a digest of whatever the token is
// vouching for.
message StandardTokenRequest {
  string request_hash = 1;
}

message TokenIssued {
  // The token as the API returned it. For classic this is a JWE whose verdicts
  // only Play can decrypt; nothing here looks inside it.
  string token = 1;

  // How long the app spent waiting on the API, which is almost all of the
  // round trip and worth seeing separately from it.
  uint32 took_ms = 2;
}

// Reads part of a file, always as root -- which is why this is a top-level
// command and not available once a session has dropped privileges. Chunked
// because the interesting files (the keystore2 database, for one) are larger
// than a frame.
message ReadFileRequest {
  string path = 1;
  uint64 offset = 2;

  // Bytes to read at most. The server clamps this to what fits in a frame.
  uint32 max_length = 3;
}

message ReadFileResponse {
  bytes data = 1;

  // Set when the read reached the end of the file. `data` may still be
  // non-empty; a short read on its own does not mean the end.
  bool eof = 2;
}

// Stops the daemon: the supervisor SIGTERMs every live session and exits, so
// other clients lose their connections. Answered before anything is signalled,
// so the caller learns it was accepted.
message KillServerRequest {}

message KillServerResponse {}

// The state change. On success the connection is a keystore session for the
// rest of its life; the daemon has permanently become `uid` and can never go
// back, which is why the UID belongs to the connection rather than to
// individual calls.
//
// There is no way to name a package here. That mapping lives in a file on the
// device, so a client reads it with read_file on this same connection and
// resolves it itself -- the daemon has no notion of packages.
message OpenKeystoreSessionRequest {
  // Becomes both the UID and the primary GID.
  uint32 uid = 1;
}

message KeystoreSessionOpened {
  // What the device's keystore2 reports from getInterfaceVersion(). The client
  // owns the capability table keyed off this number, so it can say "this device
  // is V3, that call needs V5" rather than surfacing a bare
  // UNKNOWN_TRANSACTION.
  int32 keystore_interface_version = 1;
}

// The other state change. execve on the device, as any UID and GID, with the
// process's stdio carried on this connection for the rest of its life.
//
// Nothing here is a shell: `path` is passed to execve unchanged, with no PATH
// search, no word splitting and no globbing. Run `sh -c` explicitly to get any
// of that.
//
// The daemon is root when this runs, so it can become any identity -- but
// unlike open_keystore_session it does *not* drop the session's own
// privileges. The credentials below apply to the child alone, which is a
// different process; this connection simply stops being able to say anything
// but stdin once the child is running.
message ExecRequest {
  // Absolute path to execve. Not searched for, not interpreted.
  string path = 1;

  // The full argv, argv[0] included. Empty means argv = [path], which is the
  // conventional default and almost never what a shell would have produced.
  repeated string argv = 2;

  // KEY=VALUE entries applied on top of the daemon's own environment,
  // replacing any key already there. Set clear_env to start from nothing
  // instead. An entry with no '=' is rejected.
  repeated string env = 3;

  // Start from an empty environment rather than the daemon's.
  bool clear_env = 4;

  // chdir before execve. Unset keeps the daemon's, which is "/" once it has
  // daemonized.
  optional string cwd = 5;

  // Unset runs as root. Setting uid without gid uses uid for both, matching
  // Android's app convention where the two are the same number.
  optional uint32 uid = 6;
  optional uint32 gid = 7;

  // Supplementary groups. Empty means just the primary GID -- root's
  // supplementary groups are dropped either way, since inheriting them would
  // leave the child with more access than the UID it claims. Ignored entirely
  // when neither uid nor gid is set.
  repeated uint32 groups = 8;

  // Present means allocate a pty and give the child a controlling terminal,
  // with this initial size. Absent means three pipes and no terminal, so the
  // child's isatty() is false and stderr stays a stream of its own.
  optional WindowSize pty = 9;
}

message WindowSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

// The child is running. From here the connection carries ExecInput one way and
// ExecEvent the other.
//
// A child that could not be set up or could not execve is *not* this: the
// child reports the errno back through a close-on-exec pipe before the daemon
// answers, so a bad path is an ordinary Error and the connection stays at the
// top level.
message ExecStarted {
  // On the device, and also the process group -- the child is given its own,
  // so a signal reaches everything it started.
  int32 pid = 1;

  // Echoes whether a pty was allocated, so a client that left the choice to a
  // default knows which it got.
  bool pty = 2;
}

// ---------------------------------------------------------------------------
// Exec subprotocol
//
// Unpaired in both directions: neither side answers the other, and neither
// waits. Valid only after exec succeeded, and the only thing valid from then
// on.
// ---------------------------------------------------------------------------

message ExecInput {
  oneof body {
    // Bytes for the child's stdin. Not named `stdin`: that is a macro in
    // <stdio.h>, and protoc does not rename around macros.
    bytes stdin_data = 1;

    // No more stdin will follow. Without a pty this closes the child's stdin,
    // which is what makes a `cat` finish. With one there is nothing to close
    // -- the master stays open both ways -- so the daemon writes EOT (^D)
    // instead, which the line discipline turns into an EOF in canonical mode.
    ExecStdinEof stdin_eof = 2;

    // Ignored when there is no pty.
    WindowSize resize = 3;

    // Sent to the child's whole process group, so `sh -c 'sleep 100'` dies
    // with its sleep. A pty client normally has no use for this: ^C is a byte
    // like any other and the line discipline raises the signal itself.
    uint32 signal = 4;

  }
}

message ExecStdinEof {}

message ExecEvent {
  oneof body {
    ExecOutput output = 1;
    ExecExit exit = 2;

    // Something went wrong on the daemon's side of the pump. Terminal: no
    // further events follow.
    Error error = 3;
  }
}

message ExecOutput {
  enum Stream {
    // A pty has only one stream, and it arrives as STDOUT.
    STREAM_STDOUT = 0;
    STREAM_STDERR = 1;
  }

  Stream stream = 1;
  bytes data = 2;
}

// The last event. Sent once the child has exited *and* its output has been
// drained, so nothing is lost to the race between the two; the daemon closes
// the connection immediately after.
message ExecExit {
  oneof status {
    uint32 exit_code = 1;
    uint32 term_signal = 2;
  }
}

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// android.system.keystore2.KeyDescriptor. Carries the full tuple and exposes
// every Domain value, not just the app-scoped common case.
message KeyDescriptor {
  // keystore2 Domain: APP=0, GRANT=1, SELINUX=2, BLOB=3, KEY_ID=4.
  int32 domain = 1;
  int64 nspace = 2;
  optional string alias = 3;
  optional bytes blob = 4;
}

// android.hardware.security.keymint.KeyParameter as a generic tagged value.
//
// A KeyMint Tag encodes its own TagType in its top four bits, so this one shape
// covers every parameter that exists and every one that ever will. The client
// names the tags; the server only picks which arm of KeyMint's
// KeyParameterValue union to fill, which it derives from those top four bits.
//
// Which arm to use is therefore *not* a naming decision, with one unavoidable
// exception: KeyParameterValue gives each enum its own arm (algorithm,
// blockMode, digest, ...), so a tag of type ENUM/ENUM_REP needs a tag-to-arm
// table on the server. That table is in server/src/session.cpp and is the only
// place the daemon knows what a tag means.
message KeyParameter {
  // A KeyMint Tag. Raw, and never validated.
  int32 tag = 1;

  // Which arm is set must match the tag's TagType:
  //   BOOL                     -> bool_value (KeyMint reads presence, not value)
  //   ENUM, ENUM_REP, UINT,
  //   UINT_REP                 -> integer
  //   ULONG, ULONG_REP, DATE   -> long_integer
  //   BYTES, BIGNUM            -> blob
  // A mismatch is not rejected here; keystore2 will refuse it.
  oneof value {
    bool bool_value = 2;
    uint32 integer = 3;
    uint64 long_integer = 4;
    bytes blob = 5;
  }
}

// ---------------------------------------------------------------------------
// list
// ---------------------------------------------------------------------------

message ListRequest {
  int32 domain = 1;
  int64 nspace = 2;

  // false -> IKeystoreService.listEntries (deprecated, available since V1)
  // true  -> IKeystoreService.listEntriesBatched (requires interface V3)
  //
  // The server does not choose. The client owns the capability table and the
  // pagination loop; each ListRequest is exactly one keystore2 call.
  bool batched = 3;

  // batched only: resume strictly after this alias. Unset starts at the
  // beginning.
  optional string starting_past_alias = 4;
}

message ListResponse {
  // One batch, in the order keystore2 returned it. For a batched call an
  // empty list means the end of the enumeration.
  repeated KeyDescriptor entries = 1;
}

// ---------------------------------------------------------------------------
// get_key_entry
// ---------------------------------------------------------------------------

// One entry of a key's authorization list: a KeyParameter plus which security
// level enforces it. A tag enforced by the TEE and the same tag enforced by
// keystore2 itself are different guarantees, so the level travels with it.
message Authorization {
  int32 security_level = 1;
  KeyParameter parameter = 2;
}

// android.system.keystore2.KeyMetadata. The IKeystoreSecurityLevel handle that
// comes back alongside it stays on the device.
message KeyMetadata {
  KeyDescriptor key = 1;

  // KeyMint SecurityLevel the key itself lives at.
  int32 key_security_level = 2;

  // How the key was generated: algorithm, permitted digests and paddings, key
  // size, auth requirements. This is what lets a client pick operation
  // parameters instead of being told them.
  repeated Authorization authorizations = 3;

  // Leaf certificate, DER. Absent for symmetric keys.
  optional bytes certificate = 4;

  // The rest of the chain, DER certificates concatenated. Splitting it is the
  // client's job.
  optional bytes certificate_chain = 5;

  int64 modification_time_ms = 6;
}

message GetKeyEntryRequest {
  KeyDescriptor key = 1;
}

message GetKeyEntryResponse {
  KeyMetadata metadata = 1;
}

// ---------------------------------------------------------------------------
// Operations (encrypt / decrypt / sign / verify)
//
// keystore2's createOperation hands back a live Binder handle to an operation
// object. The session's child holds that handle across round-trips, so the same
// machinery serves two shapes:
//
//   run_operation  -- create + updateAad + update + finish in one round-trip.
//   op_begin ...   -- the same steps as separate RPCs, for input too large to
//                     buffer into one message, or for incremental AAD.
//
// Requests in a session are synchronous, so at most one operation is ever in
// flight and the active one is implicit -- there are no operation IDs on the
// wire. If the client disconnects mid-operation the child dies, keystore2 sees
// the Binder death, and the operation is pruned.
//
// Auth-bound keys are out of scope: a HardwareAuthToken arrives through
// IKeystoreAuthorization, a service this daemon does not speak. The
// operation_challenge below is surfaced so a client can *see* that a key wanted
// one, not so it can satisfy it.
// ---------------------------------------------------------------------------

// The operation to create. Shared by run_operation and op_begin.
message OperationStart {
  KeyDescriptor key = 1;

  // KeyMint operation parameters: PURPOSE, plus whatever the key needs
  // (BLOCK_MODE, PADDING, DIGEST, MAC_LENGTH, NONCE, ...). Passed through as
  // sent.
  repeated KeyParameter parameters = 2;

  // keystore2 prunes a lower-priority operation to make room when true.
  bool forced = 3;

  // KeyMint SecurityLevel to ask IKeystoreService.getSecurityLevel for:
  // SOFTWARE=0, TRUSTED_ENVIRONMENT=1, STRONGBOX=2, KEYSTORE=100. The
  // sub-interface handle itself is never exposed on the wire.
  int32 security_level = 4;
}

// What createOperation returned, minus the Binder handle the server keeps.
message OperationBegun {
  // KeyMint's own parameters for the operation -- notably the NONCE it
  // generated when the caller did not supply one.
  repeated KeyParameter parameters = 1;

  // Set when the key is auth-bound: the challenge an auth token would have to
  // carry. Present means the operation will fail at finish without one.
  optional int64 operation_challenge = 2;

  // keystore2 re-wrapped the key blob (e.g. after an OS upgrade). A client
  // holding a Domain::BLOB descriptor should replace it with this.
  optional bytes upgraded_blob = 3;
}

message RunOperationRequest {
  OperationStart start = 1;

  // AEAD associated data, sent before any input. Kept separate from `input`
  // because updateAad and update are different calls.
  optional bytes aad = 2;

  // The whole crypto input. Absent is legal: finish() alone is a valid
  // operation for, say, an empty-message signature.
  optional bytes input = 3;

  // KeyPurpose::VERIFY only: the signature to check.
  optional bytes signature = 4;
}

message RunOperationResponse {
  OperationBegun begun = 1;

  // Everything update() and finish() produced, concatenated in order.
  optional bytes output = 2;
}

message OpBeginRequest {
  OperationStart start = 1;
}

message OpBeginResponse {
  OperationBegun begun = 1;
}

message OpUpdateAadRequest {
  bytes aad = 1;
}

message OpUpdateAadResponse {}

message OpUpdateRequest {
  bytes input = 1;
}

message OpUpdateResponse {
  // KeyMint may buffer instead of emitting on every update, so an absent
  // output is normal rather than an error.
  optional bytes output = 1;
}

message OpFinishRequest {
  optional bytes input = 1;
  optional bytes signature = 2;
}

message OpFinishResponse {
  optional bytes output = 1;
}

message OpAbortRequest {}

message OpAbortResponse {}

// ---------------------------------------------------------------------------
// Keystore subprotocol envelopes
//
// Valid only after open_keystore_session succeeded, and the only thing valid
// from then on.
// ---------------------------------------------------------------------------

message KeystoreRequest {
  oneof body {
    ListRequest list = 1;
    GetKeyEntryRequest get_key_entry = 8;
    RunOperationRequest run_operation = 2;
    OpBeginRequest op_begin = 3;
    OpUpdateAadRequest op_update_aad = 4;
    OpUpdateRequest op_update = 5;
    OpFinishRequest op_finish = 6;
    OpAbortRequest op_abort = 7;
    EndSessionRequest end_session = 9;
  }
}

// Ends the keystore session and returns the connection to the top level. The
// daemon climbs back to root through the saved UID it kept for exactly this,
// so the next thing on this connection starts from root again -- including
// another keystore session, for a different UID if you like.
//
// A session is still one UID for its whole life. This ends one; it does not
// change one.
message EndSessionRequest {}

message EndSessionResponse {}

message KeystoreResponse {
  oneof body {
    Error error = 1;
    ListResponse list = 2;
    GetKeyEntryResponse get_key_entry = 9;
    RunOperationResponse run_operation = 3;
    OpBeginResponse op_begin = 4;
    OpUpdateAadResponse op_update_aad = 5;
    OpUpdateResponse op_update = 6;
    OpFinishResponse op_finish = 7;
    OpAbortResponse op_abort = 8;
    EndSessionResponse end_session = 10;
  }
}
